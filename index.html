<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doctor Unknown</title>
<meta name="description" content="Doctor Unknown. Future business coming soon.">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cpath d='M100,10 L177.9,55 L177.9,145 L100,190 L22.1,145 L22.1,55' fill='none' stroke='%231b2236' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b2236;
    --muted: #525a6e;
    --bond: #1b2236;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; color: var(--ink); }
  body {
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  /* Molecule overlay across the white background */
  .molecule {
    position: fixed; left: 50%; top: 50%;
    width: max(1000px, 115vw); height: auto;
    transform: translate(-50%, -50%);
    pointer-events: none; z-index: 0;
  }
  .veil {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse 46% 42% at 50% 48%,
      #fff 0%, rgba(255,255,255,.92) 45%, rgba(255,255,255,0) 100%);
  }

  main {
    position: relative; z-index: 2;
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px 24px;
  }
  .lockup { display: flex; align-items: center; justify-content: center; gap: clamp(14px, 3vw, 32px); }
  .logo { width: clamp(84px, 14vw, 150px); height: auto; display: block; flex: none; }
  h1 {
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-variation-settings: "opsz" 144;
    font-size: clamp(2rem, 7vw, 4.25rem);
    line-height: 1.05; letter-spacing: -0.015em;
    margin: 0; text-align: left;
  }
  .soon {
    font-size: clamp(1.05rem, 2.4vw, 1.3rem);
    color: var(--muted); margin: 18px 0 0; letter-spacing: 0.01em;
  }
  .domain {
    position: fixed; z-index: 2; left: 0; right: 0; bottom: 22px;
    font-size: .9rem; color: var(--muted); text-align: center;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* One reveal: the hexagon draws itself and stops with its open side, then the emblem appears */
  .hex { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.9s cubic-bezier(.5,0,.2,1) .3s forwards; }
  .inner { opacity: 0; animation: show 1s ease 1.6s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes show { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .hex { animation: none; stroke-dashoffset: 0; }
    .inner { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<!-- Unknown molecule: fused rings, branches and unidentified atoms (?) -->
<svg class="molecule" viewBox="200 150 600 430" aria-hidden="true" focusable="false">
  <g fill="none" stroke="#1b2236" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="2.2" opacity=".16">
      <path d="M380,290 L440.6,325 L440.6,395 L380,430 L319.4,395 L319.4,325 Z"/>
      <path d="M440.6,325 L501.2,290 L561.8,325 L561.8,395 L501.2,430 L440.6,395"/>
      <path d="M380,290 L380,220 L440,185 M380,220 L320,185"/>
      <path d="M319.4,395 L259,430 L259,500"/>
      <path d="M380,430 L380,500 L440,535"/>
      <path d="M561.8,325 L622,290 L682,325 L743,290"/>
      <path d="M561.8,395 L622,430 L622,500"/>
    </g>
    <g stroke-width="1.6" opacity=".13">
      <path d="M384.6,303.1 L427,327.5 M427,392.5 L384.6,416.95 M328.4,384.5 L328.4,335.5"/>
      <path d="M552.8,335.5 L552.8,384.5 M505.8,303.1 L548.2,327.5 M496.6,416.95 L454.2,392.45"/>
    </g>
  </g>
</svg>
<div class="veil"></div>

<main>
  <div class="lockup">
  <svg class="logo" viewBox="0 0 200 200" role="img" aria-label="Doctor Unknown logo: an open hexagon holding a wooden bat with a snake coiled around it">
    <defs>
      <linearGradient id="wood" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#d9a066"/>
        <stop offset=".5" stop-color="#b07a43"/>
        <stop offset="1" stop-color="#7a4b22"/>
      </linearGradient>
      <g id="sk-all" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M80,150 C80,144 120,142 120,136 C120,130 80,128 80,122 C80,116 120,114 120,108 C120,102 80,100 80,94 C80,88 120,86 120,80 C120,74 80,72 80,66" stroke="#2e7a58" stroke-width="6.5"/>
        <path d="M80,150 C80,156 84,159 89,160" stroke="#2e7a58" stroke-width="3.2"/>
        <path d="M80,150 C80,144 120,142 120,136 C120,130 80,128 80,122 C80,116 120,114 120,108 C120,102 80,100 80,94 C80,88 120,86 120,80 C120,74 80,72 80,66" stroke="#9ad7b5" stroke-width="2" stroke-dasharray="1.4 5"/>
      </g>
      <g id="sk-front" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M80,150 C80,144 120,142 120,136 M80,122 C80,116 120,114 120,108 M80,94 C80,88 120,86 120,80" stroke="#fff" stroke-width="9.5"/>
        <path d="M80,150 C80,144 120,142 120,136 M80,122 C80,116 120,114 120,108 M80,94 C80,88 120,86 120,80" stroke="#2e7a58" stroke-width="6.5"/>
        <path d="M80,150 C80,144 120,142 120,136 M80,122 C80,116 120,114 120,108 M80,94 C80,88 120,86 120,80" stroke="#9ad7b5" stroke-width="2" stroke-dasharray="1.4 5"/>
      </g>
    </defs>

    <!-- Hexagon with its entire top-left side removed -->
    <path class="hex" pathLength="1" d="M100,10 L177.9,55 L177.9,145 L100,190 L22.1,145 L22.1,55"
          fill="none" stroke="#1b2236" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <g class="inner" transform="rotate(35 100 100)">
      <use href="#sk-all"/>
      <!-- Wooden bat -->
      <path d="M89,50 Q89,38 100,38 Q111,38 111,50 L111,82 C111,100 104,108 103.5,122 L103.5,148 L107,150 L107,157 Q107,161 100,161 Q93,161 93,157 L93,150 L96.5,148 L96.5,122 C96,108 89,100 89,82 Z"
            fill="url(#wood)" stroke="#4a2c12" stroke-width="1.8" stroke-linejoin="round"/>
      <g fill="none" stroke-linecap="round">
        <path d="M95,58 C95,88 98,110 99,140" stroke="#6b4220" stroke-width=".8" opacity=".55"/>
        <path d="M105,56 C106,86 101,106 101,136" stroke="#6b4220" stroke-width=".8" opacity=".55"/>
        <path d="M93.5,52 L93.5,80" stroke="#f0c590" stroke-width="1.6" opacity=".6"/>
      </g>
      <use href="#sk-front"/>
      <!-- Snake head -->
      <ellipse cx="80" cy="60" rx="6" ry="8" fill="#2e7a58"/>
      <circle cx="77.6" cy="57.5" r="1.3" fill="#fff"/><circle cx="82.4" cy="57.5" r="1.3" fill="#fff"/>
      <path d="M80,52 L80,47 M80,47 L77.5,44 M80,47 L82.5,44" fill="none" stroke="#b83a2e" stroke-width="1" stroke-linecap="round"/>
    </g>
  </svg>

  <h1>Doctor Unknown</h1>
  </div>
  <p class="soon">Future business coming soon.</p>
</main>

<div class="domain">doctorunknown.com</div>

</body>
</html>
