<style>
  :root {
    --ink: #1b2236;
    --muted: #525a6e;
    --bond: #1b2236;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; color: var(--ink); }
  body {
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  /* Molecule network covering the whole white background */
  .molecule { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .molecule .bond { stroke: #9ea4ae; stroke-width: 1.6; fill: none; stroke-linecap: round; }
  .molecule .atom { fill: #868c97; font-family: "Instrument Sans", system-ui, sans-serif; font-weight: 500; dominant-baseline: central; text-anchor: middle; }
  .molecule .cap { fill: #a9aeb7; font-family: "Fraunces", Georgia, serif; font-style: italic; text-anchor: middle; }
  .molecule .q { fill: #fff; stroke: #7c838e; stroke-width: 1.8; }
  .molecule .qt { fill: #646b77; font-family: "Fraunces", Georgia, serif; text-anchor: middle; dominant-baseline: central; }
  .molecule .unknown-cmpd .cap { fill: #7c838e; }
  .veil {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse 46% 42% at 50% 48%,
      #fff 0%, rgba(255,255,255,.92) 45%, rgba(255,255,255,0) 100%);
  }

  main {
    position: relative; z-index: 2;
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px 24px;
  }
  .lockup { display: flex; align-items: center; justify-content: center; gap: clamp(14px, 3vw, 32px); }
  .logo { width: clamp(100px, 16.5vw, 178px); height: auto; display: block; flex: none; }
  h1 {
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-variation-settings: "opsz" 144;
    font-size: clamp(2rem, 7vw, 4.25rem);
    line-height: 1.05; letter-spacing: -0.015em;
    margin: 0; text-align: left;
  }
  h1 .word { white-space: nowrap; }
  h1 .glass { display: inline-block; width: .7em; height: .74em; vertical-align: -0.035em; margin: 0 .015em 0 -.01em; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .soon {
    font-size: clamp(1.05rem, 2.4vw, 1.3rem);
    color: var(--muted); margin: 18px 0 0; letter-spacing: 0.01em;
  }
  .contact { font-size: .98rem; color: var(--muted); margin: 14px 0 0; line-height: 1.7; }
  .contact a { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .contact a:hover { text-decoration-thickness: 2px; }
  .contact a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 2px; }
  .domain {
    position: fixed; z-index: 2; left: 0; right: 0; bottom: 22px;
    font-size: .9rem; color: var(--muted); text-align: center;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .domain span { background: #fff; padding: 4px 12px; border-radius: 999px; box-shadow: 0 0 14px 10px #fff; }

  /* The hexagon draws itself and stops with its open side and tail */
  .hex { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.9s cubic-bezier(.5,0,.2,1) .3s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  /* Then the staff of Hermes fades in; its snakes slither and flick their tongues */
  .emblem { opacity: 0; animation: show 1s ease 1.7s forwards; }
  @keyframes show { to { opacity: 1; } }
  .tongue { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 2.6s ease-in-out infinite; }
  @keyframes flick { 0%, 70%, 100% { transform: scaleY(0); } 76%, 88% { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) {
    .hex { animation: none; stroke-dashoffset: 0; }
    .emblem { animation: none; opacity: 1; }
    .tongue { animation: none; }
  }

  /* Tall, narrow screens (phones): a narrower clear zone behind the text */
  @media (max-aspect-ratio: 4/5) {
    .veil { background: radial-gradient(ellipse 60% 26% at 50% 48%,
      #fff 0%, rgba(255,255,255,.92) 45%, rgba(255,255,255,0) 100%); }
  }
</style>
